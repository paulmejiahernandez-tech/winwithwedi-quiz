<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>win with wedi</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#009FE3">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;700;900&display=swap">
<style>
/* Layout : écran unique en colonne, bandeau titre en barres wedi, carrés pour réponses / progression / score. */
:root{
  --blue:#009EE0;        /* wedi blue, 100 % cyan */
  --blue-ink:#0077AA;    /* bleu lisible pour petits textes sur blanc */
  --grey:#585858;        /* wedi grey */
  --grey-soft:#E3E4E5;   /* fond gris clair des maquettes CD */
  --white:#FFFFFF;
  --ok:#2E8B3E;
  --ko:#D7262B;
  --line:#C9CACB;
  --font:"Noto Sans",Verdana,Arial,sans-serif;
  --dots:Verdana,"DejaVu Sans",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden}
body{margin:0;background:var(--white);color:var(--grey);font-family:var(--font);font-weight:300;font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.dots{font-family:var(--dots)}
b,strong{font-weight:700}

/* ---- Barre de titre (CD : barres connectées, alignées à gauche, sans arrondi) ---- */
.bar{margin:0;font-weight:900;font-size:clamp(1.6rem,6vw,2.6rem);line-height:1.18;text-wrap:balance}
.bar span{background:var(--blue);color:var(--white);padding:.06em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sub{display:inline-block;background:var(--white);margin-top:14px}
.sub strong{display:block;color:var(--blue-ink);font-weight:900}

/* ---- En-tête ---- */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{display:inline-flex;align-items:center;gap:12px;font-weight:700;font-size:.95rem;color:var(--grey)}
.brand img{height:64px;width:auto;display:block}
.theme{display:block;margin:0 0 6px;font-weight:900;font-size:clamp(1.25rem,4.6vw,1.6rem);letter-spacing:.03em;text-transform:uppercase;color:var(--blue-ink);line-height:1.2}
.test{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:2px solid var(--blue);color:var(--blue-ink);padding:2px 8px}

/* ---- Panneaux ---- */
.panel{background:var(--grey-soft);padding:22px;margin-top:22px}
.hero{background:var(--grey-soft);padding:28px 22px 22px}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.fact{background:var(--white);padding:10px 14px;font-weight:700;color:var(--grey)}
.fact b{color:var(--blue-ink);font-weight:900}

/* ---- Formulaire ---- */
form{display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
label.f{display:grid;gap:4px;font-weight:700;font-size:.9rem}
/* Écran d'accueil (maquette Figma) : champ et bouton sur toute la largeur du bloc */
.start-form{gap:16px}
.start-field{display:grid;gap:8px}
.start-field label{font-weight:700;font-size:.95rem;color:var(--grey)}
.start-field input[type=email]{height:56px;font-size:1rem;padding:0 16px;border:1px solid var(--line);font-weight:300}
.start-field input[type=email]::placeholder{color:#9A9A99}
.field-help{margin:0;font-size:.72rem;font-weight:300;color:var(--grey)}
.start-form .check{font-size:.82rem;font-weight:300;align-items:flex-start}
.start-form .check input{width:22px;height:22px;margin-top:0}
.btn.btn-start{justify-self:stretch;width:100%;height:56px;padding:0 22px;font-size:1.2rem;margin-top:6px}
.start-note{display:grid;gap:8px;font-size:.72rem;font-weight:300}
.start-note p{margin:0}
.start-note a{font-size:.82rem;font-weight:700;color:var(--blue);text-decoration:none}
.start-note a:hover{text-decoration:underline}
input[type=text],input[type=email],input[type=password]{font:inherit;font-weight:400;padding:12px;border:2px solid var(--line);background:var(--white);color:var(--grey);border-radius:0;width:100%}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.88rem}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--blue);flex:none}
.msg{padding:12px 14px;font-weight:700;font-size:.92rem}
.msg.err{background:var(--white);border-left:6px solid var(--ko);color:var(--ko)}
.msg.info{background:var(--white);border-left:6px solid var(--blue)}
.hint{font-size:.82rem}
.hint code{font-family:var(--dots);font-size:.8rem;background:var(--white);padding:1px 5px}

/* ---- Boutons ---- */
.btn{font:inherit;font-weight:900;border:0;border-radius:0;background:var(--blue);color:var(--white);padding:14px 22px;cursor:pointer;font-size:1rem;justify-self:start}
.btn:hover{background:var(--blue-ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--white);color:var(--grey);border:2px solid var(--grey)}
.btn.ghost:hover{background:var(--grey);color:var(--white)}
.btn.danger{background:var(--white);color:var(--ko);border:2px solid var(--ko)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---- Quiz ---- */
.progress{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 18px}
.progress i{width:18px;height:18px;border:2px solid var(--blue);display:block}
.progress i.done-ok{background:var(--blue)}
.progress i.done-ko{background:var(--grey);border-color:var(--grey)}
.progress i.now{outline:2px solid var(--grey);outline-offset:2px}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.qnum{font-weight:900;color:var(--blue-ink);font-variant-numeric:tabular-nums}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem}
h2.q{font-weight:700;font-size:clamp(1.2rem,4.4vw,1.55rem);line-height:1.3;margin:10px 0 18px;color:var(--grey);text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-weight:400;font-size:1.02rem;background:var(--white);color:var(--grey);border:2px solid var(--white);border-radius:0;padding:0 14px 0 0;cursor:pointer;min-height:56px}
.opt .k{flex:none;width:56px;align-self:stretch;display:grid;place-items:center;background:var(--blue);color:var(--white);font-weight:900;font-size:1.1rem}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt[disabled]{cursor:default}
.opt.is-ok{border-color:var(--ok)}.opt.is-ok .k{background:var(--ok)}
.opt.is-ko{border-color:var(--ko)}.opt.is-ko .k{background:var(--ko)}
.opt.dim{opacity:.55}
.fb{margin-top:16px;background:var(--white);padding:14px 16px;border-left:6px solid var(--blue)}
.fb.ok{border-left-color:var(--ok)}.fb.ko{border-left-color:var(--ko)}
.fb strong{display:block;font-weight:900}

/* ---- Résultat ---- */
.result{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media (max-width:520px){.result{grid-template-columns:1fr}}
.score{width:150px;height:150px;background:var(--blue);color:var(--white);display:grid;place-content:center;text-align:center;font-weight:900}
.score b{font-size:3rem;line-height:1;font-weight:900;font-variant-numeric:tabular-nums}
.score span{font-weight:700;font-size:.9rem}
.recap{display:grid;gap:8px;margin-top:6px}
.rc{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:.92rem;background:var(--white);padding:10px 12px}
.rc i{width:22px;height:22px;display:block}
.rc i.ok{background:var(--blue)}.rc i.ko{background:var(--grey)}
.rc small{display:block;color:var(--grey)}

/* ---- Admin ---- */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.stats{gap:6px}.stat{padding:10px}.stat b{font-size:1.35rem}.stat span{font-size:.68rem}}
.stat{background:var(--white);padding:14px}
.stat b{display:block;font-size:1.8rem;font-weight:900;color:var(--blue-ink);font-variant-numeric:tabular-nums;line-height:1.1;overflow-wrap:anywhere}
.stat span{font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.qrate{display:grid;gap:6px}
.qr{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:10px;align-items:center;font-size:.85rem}
.qr .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qr .track{height:12px;background:var(--white)}
.qr .fill{height:12px;background:var(--blue)}
.qr .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;background:var(--white)}
table{border-collapse:collapse;width:100%;font-size:.85rem;min-width:640px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--grey-soft);white-space:nowrap}
th{font-weight:900;color:var(--white);background:var(--grey)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
h3{font-weight:900;font-size:1.05rem;margin:22px 0 10px;color:var(--grey)}
.foot{margin-top:34px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--grey);text-decoration:underline;cursor:pointer}
.confirm{background:var(--white);border:2px solid var(--ko);padding:12px;display:grid;gap:10px}
/* ---- Écrans animés : intro de thème et fin du quiz ---- */
/* Plein écran adaptatif : le contenu reste dans l'écran sur mobile (portrait et paysage), tablette et ordinateur. */
.overlay{position:fixed;inset:0;z-index:30;background:var(--blue);color:var(--white);display:flex;cursor:pointer;
  overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.overlay .inner{width:100%;max-width:760px;margin:auto;min-width:0;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:24px;
  display:grid;gap:clamp(10px,2.5vh,18px)}
.overlay .inner > *{min-width:0;max-width:100%}
.overlay .eyebrow{margin:0;font-weight:700;font-size:clamp(.78rem,2.6vw,.95rem);letter-spacing:.1em;text-transform:uppercase}
.overlay .big{margin:0;transform-origin:left center;font-weight:900;font-size:clamp(1.9rem,min(11vw,12vh),5.2rem);line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.overlay .big span{background:var(--white);color:var(--blue);padding:.02em .22em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.overlay .meta{margin:0;font-weight:700;font-size:clamp(.92rem,3.4vw,1.1rem)}
.overlay .sq{display:flex;flex-wrap:wrap;gap:clamp(6px,1.8vw,10px)}
.overlay .sq i{width:clamp(18px,5.6vw,26px);aspect-ratio:1;border:3px solid var(--white);display:block;flex:none}
.overlay .sq i.on{background:var(--white)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.result-msg{display:grid;gap:10px}
.result-msg p{margin:0}
.result-msg .lead{font-weight:900;font-size:1.15rem;color:var(--grey)}
.res-grid{display:flex;flex-wrap:wrap;gap:12px}
.res-sq{width:170px;aspect-ratio:1;max-width:100%;background:var(--blue);color:var(--white);display:grid;place-content:center;text-align:center;padding:10px}
.res-sq.grey{background:var(--grey)}
.res-sq b{font-size:2.5rem;line-height:1.05;font-weight:900;font-variant-numeric:tabular-nums}
.res-sq span{font-weight:700;font-size:.85rem}
@media (max-width:420px){.res-sq{width:calc(50% - 6px)}.res-sq b{font-size:1.8rem}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segbtn{font:inherit;font-weight:700;font-size:.9rem;border:2px solid var(--blue);border-radius:0;background:var(--white);color:var(--blue-ink);padding:8px 14px;cursor:pointer}
.segbtn[aria-pressed="true"]{background:var(--blue);color:var(--white)}
input[type=date]{font:inherit;font-weight:400;padding:10px;border:2px solid var(--line);background:var(--white);color:var(--grey);border-radius:0;width:100%}
.period{margin:14px 0 12px;font-weight:900;color:var(--grey)}
.podium{display:grid;gap:8px}
.pod{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--grey-soft);padding:8px 12px 8px 8px}
.pod .rk{width:44px;height:44px;display:grid;place-items:center;background:var(--blue);color:var(--white);font-weight:900;font-size:1.2rem}
.pod strong{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod small{display:block;font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pv{text-align:right;font-weight:900;color:var(--blue-ink);font-variant-numeric:tabular-nums}
.pod .pv small{font-weight:700;color:var(--grey)}
tr.win td{font-weight:700;background:#E5F5FC}

@media (prefers-reduced-motion:no-preference){
  .screen{animation:in .25s ease-out}
  @keyframes in{from{transform:translateY(6px)}to{transform:none}}
  .overlay{animation:ovIn .4s ease-out both;will-change:opacity}
  .overlay.out{animation:ovOut .5s ease-in-out both}
  @keyframes ovIn{from{opacity:0}to{opacity:1}}
  @keyframes ovOut{from{opacity:1}to{opacity:0}}

  .overlay .eyebrow{animation:up .45s ease-out .15s both}
  .overlay .big{animation:slam .6s cubic-bezier(.2,1.25,.4,1) .25s both}
  .overlay .meta{animation:up .45s ease-out .9s both}
  .overlay .sq i{animation:pop .35s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(.6s + var(--n,0) * .08s)}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes slam{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
  .res-sq{animation:pop .5s cubic-bezier(.3,1.6,.5,1) .15s both}
  .res-sq.grey{animation-delay:.3s}
  .result-msg > *{animation:up .5s both;animation-delay:calc(.4s + var(--d,0) * .35s)}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <span class="brand"><img src="logo-wedi.png" alt="win with wedi" onerror="this.replaceWith('win with wedi')"></span>
    <span class="test" id="modeTag">Version test</span>
  </header>
  <main id="app"></main>
  <footer class="foot">
    <span>Quiz win with wedi 2026 · une participation par adresse e-mail</span>
    <button class="linkbtn" id="adminLink" type="button">Espace organisateur</button>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* =====================================================================
   CONFIGURATION — à modifier pour chaque concours de la série
   ===================================================================== */
const CONFIG = {
  CONCOURS_ID: "aubade-2026-01",          // change à chaque concours : 1 participation par adresse e-mail et par concours
  CONCOURS_TITRE: "win with wedi Quiz 2026",
  LOT: "des goodies wedi",
  LIEN_REGLEMENT: "#",                    // URL de la page du règlement (s'ouvre dans un nouvel onglet)
  // URL du script Google (voir apps-script.gs). Vide = version test : données gardées sur l'appareil.
  ENDPOINT: "https://script.google.com/macros/s/AKfycbwasGVy3WT8qtCBxKpfkElMWkfuHBjRF9TR84hUWqY5rBhdBVQmoRzAi_EY6e3oMsVE_Q/exec",
  ADMIN_PIN: "test",                      // mode hors ligne uniquement ; en ligne, le PIN est défini et vérifié dans Apps Script
  NB_GAGNANTS: 5,                         // les 5 meilleurs (score, puis temps le plus court) gagnent
  DUREE_INTRO_MS: 3000,                   // durée de l'écran d'annonce de chaque thème
  DUREE_FIN_MS: 3000                      // durée de l'animation "Félicitations" (même durée que les thèmes)
};

const QUESTIONS = [
  {p:"Fundo Thermo", q:"Quel niveau d’efficacité en récupération de chaleur atteint le Fundo Thermo ?", o:["25 %","50 %","75 %"], a:1, e:"Le Fundo Thermo atteint 50 % d’efficacité en récupération de chaleur."},
  {p:"Fundo Thermo", q:"De quelle manière le Fundo Thermo fonctionne-t-il ?", o:["Avec une batterie","Sans électricité","Avec un moteur"], a:1, e:"Le Fundo Thermo fonctionne sans électricité."},
  {p:"Fundo Thermo", q:"Que permet de faire l’échangeur de chaleur intégré ?", o:["Refroidir l’eau","Préchauffer l’eau","Filtrer l’eau"], a:1, e:"L’échangeur de chaleur intégré préchauffe l’eau."},
  {p:"Cloison XS", q:"Quelle est la largeur de la cloison XS ?", o:["200 mm","300 mm","500 mm"], a:1, e:"La cloison XS mesure 300 mm de large."},
  {p:"Cloison XS", q:"Qu’est-ce qui est intégré en usine dans la cloison XS ?", o:["Une évacuation","Les conduites d’eau","Un siphon"], a:1, e:"Les conduites d’eau sont intégrées en usine."},
  {p:"Cloison XS", q:"Comment peut-on ajuster la hauteur de la cloison XS ?", o:["En la chauffant","En la pliant","En la recoupant"], a:2, e:"On ajuste la hauteur de la cloison XS en la recoupant."},
  {p:"Vasque Flex", q:"Quelle est la capacité de charge maximale de la vasque Flex ?", o:["100 kg","150 kg","200 kg"], a:1, e:"La vasque Flex supporte jusqu’à 150 kg."},
  {p:"Vasque Flex", q:"Comment se fixe la vasque Flex ?", o:["Avec des vis","Avec des consoles fixées au mur","Par collage"], a:1, e:"La vasque Flex se fixe avec des consoles fixées au mur."},
  {p:"Vasque Flex", q:"Quel type de finition pour la vasque Flex ?", o:["Peinture","Carrelage","Parquet"], a:1, e:"La vasque Flex se finit en carrelage."},
  {p:"Fundo Solido", q:"En combien de temps le Fundo Solido est-il prêt à recevoir le revêtement PVC ?", o:["24 heures","48 heures","1 semaine"], a:1, e:"Le Fundo Solido est prêt à recevoir le revêtement PVC en 48 heures."},
  {p:"Fundo Solido", q:"Quel revêtement est compatible avec le Fundo Solido ?", o:["Carrelage","Parquet","Sol souple PVC"], a:2, e:"Le Fundo Solido est compatible avec le sol souple PVC."},
  {p:"Fundo Solido", q:"Quel est le matériau utilisé pour le cœur du Fundo Solido ?", o:["Bois","Mousse PET (bouteilles recyclées)","Mousse de polystyrène expansé"], a:1, e:"Le cœur du Fundo Solido est en mousse PET issue de bouteilles recyclées."}
];

/* =====================================================================
   STOCKAGE — local (version test) ou script Google (site en ligne)
   ===================================================================== */
const LS_KEY = "wediQuiz.results";
function lsRead(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"[]") }catch(e){ return [] } }
function lsWrite(list){ try{ localStorage.setItem(LS_KEY, JSON.stringify(list)); return true }catch(e){ return false } }
async function api(action, payload){
  const r = await fetch(CONFIG.ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,concours:CONFIG.CONCOURS_ID,...payload})});
  if(!r.ok) throw new Error("Serveur indisponible ("+r.status+")");
  return r.json();
}
const Store = {
  async checkMember(email){
    if(CONFIG.ENDPOINT) return api("check",{email});
    if(lsRead().some(r=>r.concours===CONFIG.CONCOURS_ID && r.email===email)) return {ok:false,reason:"played"};
    return {ok:true};
  },
  async save(result){
    const list = lsRead(); list.push(result); lsWrite(list);
    if(CONFIG.ENDPOINT) return api("submit",{result});
    return {ok:true,score:result.score};
  },
  async list(pin){
    if(CONFIG.ENDPOINT){ const r = await api("list",{pin}); if(!r.ok) throw new Error(r.reason==="pin"?"Code PIN incorrect.":"Lecture impossible."); return r.results }
    if(pin!==CONFIG.ADMIN_PIN) throw new Error("Code PIN incorrect.");
    return lsRead().filter(r=>r.concours===CONFIG.CONCOURS_ID);
  },
  clearLocal(){ lsWrite(lsRead().filter(r=>r.concours!==CONFIG.CONCOURS_ID)) }
};

/* =====================================================================
   OUTILS
   ===================================================================== */
const $app = document.getElementById("app");
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dots = s => esc(s).replace(/(\.\.\.|…)/g,'<span class="dots">...</span>');
function bar(lines){ return '<h1 class="bar">'+lines.map(l=>'<span>'+dots(l)+'</span>').join("<br>")+'</h1>' }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a }
const fmtClock = s => s<60 ? s+" s" : Math.floor(s/60)+" min "+String(s%60).padStart(2,"0")+" s";
const fmtTime = s => Math.floor(s/60)+" min "+String(s%60).padStart(2,"0")+" s";
const fmtDate = iso => new Date(iso).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"});
function show(html){ $app.innerHTML = '<section class="screen">'+html+'</section>'; window.scrollTo(0,0) }

async function saveFile(filename, data){
  let dl = null;
  try{ if(window.claude && window.claude.use) dl = await window.claude.use("downloads") }catch(e){}
  if(dl){ await dl.save({filename,data}); return }
  const blob = data instanceof Blob ? data : new Blob([data]);
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

async function onStart(ev){

  const btn = document.getElementById("goBtn"); btn.disabled = true; btn.textContent = "Vérification ...";
  try{
    const r = await Store.checkMember(player.email);
    if(!r.ok){
      return screenStart(r.reason==="played" ? "Cette adresse e-mail a déjà participé à ce concours."
        : "Adresse e-mail non valide. Vérifiez-la et réessayez.");

const THEMES = [...new Set(QUESTIONS.map(q=>q.p))];
const reducedMotion = () => { try{ return matchMedia("(prefers-reduced-motion: reduce)").matches }catch(e){ return false } };

/* Sur mobile, ferme le clavier et attend que l'écran retrouve sa taille normale
   (sinon le premier écran animé peut apparaître décalé ou coupé). */
function settleViewport(){
  try{ if(document.activeElement && document.activeElement.blur) document.activeElement.blur() }catch(e){}
  window.scrollTo(0,0);
  const vv = window.visualViewport;
  return new Promise(resolve=>{
    const t0 = Date.now();
    (function check(){
      const ok = !vv || (Math.abs(vv.scale-1)<0.01 && vv.height > window.innerHeight*0.85 && vv.offsetLeft<1);
      if(ok || Date.now()-t0>700){ window.scrollTo(0,0); resolve() } else setTimeout(check,50);
    })();
  });
}

/* Écran animé plein écran de durée fixe (identique pour tous).
   À la fin : swap() prépare l'écran suivant SOUS l'animation, puis l'animation s'efface en fondu. */
function overlay(html, ms, swap){
  const el = document.createElement("div");
  el.className = "overlay"; el.setAttribute("role","status"); el.setAttribute("aria-live","polite");
  el.innerHTML = '<div class="inner">'+html+'</div>';
  document.body.appendChild(el);
  setTimeout(async ()=>{
    await swap();
    if(reducedMotion()){ el.remove(); return }
    requestAnimationFrame(()=>{
      el.classList.add("out");
      el.addEventListener("animationend", ()=>el.remove(), {once:true});
      setTimeout(()=>el.remove(), 900);
    });
  }, ms);
}

function squares(n, onCount){
  return '<div class="sq" aria-hidden="true">'+Array.from({length:n},(_,i)=>`<i class="${i<onCount?"on":""}" style="--n:${i}"></i>`).join("")+'</div>';
}

function startQuiz(){
  state = {i:0, answers:[], start:Date.now(), paused:false, order:QUESTIONS.map((q,idx)=>({idx, opts:shuffle(q.o.map((t,k)=>({t,k})))}))};
  clearInterval(timerId);
  timerId = setInterval(()=>{ if(state.paused) return; const t=document.getElementById("timer"); if(t) t.textContent = fmtTime(Math.round((Date.now()-state.start)/1000)) },1000);
  nextStep();
}

/* Avant chaque question : si le thème change, on l'annonce. Le chrono est mis en pause pendant l'annonce. */
function nextStep(){
  const p = QUESTIONS[state.order[state.i].idx].p;
  const prev = state.i>0 ? QUESTIONS[state.order[state.i-1].idx].p : null;
  if(p===prev) return renderQuestion();
  const n = THEMES.indexOf(p), count = QUESTIONS.filter(q=>q.p===p).length;
  const t0 = Date.now(); state.paused = true;
  overlay(`
    <p class="eyebrow">Thème ${n+1} / ${THEMES.length}</p>
    <p class="big"><span>${dots(p)}</span></p>
    ${squares(THEMES.length, n+1)}
    <p class="meta">${count} questions</p>`,
    CONFIG.DUREE_INTRO_MS,
    ()=>{ state.start += Date.now()-t0; state.paused = false; renderQuestion() });
}

function renderQuestion(){
  const cur = state.order[state.i], Q = QUESTIONS[cur.idx];
  const prog = state.order.map((_,n)=>{
    const a = state.answers[n];
    return `<i class="${a? (a.ok?"done-ok":"done-ko") : ""} ${n===state.i?"now":""}" title="Question ${n+1}"></i>`;
  }).join("");
  show(`
    <h2 class="theme">${esc(Q.p)}</h2>
    <div class="progress" aria-hidden="true">${prog}</div>
    <div class="qhead"><span class="qnum">Question ${state.i+1} / ${QUESTIONS.length}</span><span class="timer" id="timer">${fmtTime(Math.round((Date.now()-state.start)/1000))}</span></div>
    <h2 class="q">${esc(Q.q)}</h2>
    <div class="opts" role="group" aria-label="Réponses">
      ${cur.opts.map((o,n)=>`<button class="opt" type="button" data-k="${o.k}"><span class="k">${"ABC"[n]}</span><span>${esc(o.t)}</span></button>`).join("")}
    </div>
    <div id="fb"></div>`);
  document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.k)));
}

function answer(k){
  const cur = state.order[state.i], Q = QUESTIONS[cur.idx], ok = k===Q.a;
  state.answers[state.i] = {q:cur.idx, choix:k, ok};
  document.querySelectorAll(".opt").forEach(b=>{
    const bk = +b.dataset.k; b.disabled = true;
    if(bk===Q.a) b.classList.add("is-ok"); else if(bk===k) b.classList.add("is-ko"); else b.classList.add("dim");
  });
  const last = state.i===QUESTIONS.length-1;
  document.getElementById("fb").innerHTML = `
    <div class="fb ${ok?"ok":"ko"}" role="status"><strong>${ok?"Bonne réponse !":"Pas tout à fait."}</strong>${esc(Q.e)}</div>
    <div class="row" style="margin-top:14px"><button class="btn" type="button" id="next">${last?"Terminer le quiz":"Question suivante"}</button></div>`;
  const nx = document.getElementById("next"); nx.focus();
  nx.addEventListener("click", ()=>{ if(last) finish(); else { state.i++; nextStep() } });
}

function finish(){
  clearInterval(timerId);
  const score = state.answers.filter(a=>a.ok).length;
  const result = {
    id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
    concours: CONFIG.CONCOURS_ID, prenom:player.prenom, nom:player.nom, email:player.email, code:player.code,
    score, total:QUESTIONS.length, dureeSec: Math.round((Date.now()-state.start)/1000),
    date: new Date().toISOString(),
    reponses: state.answers.map(a=>({q:a.q, choix:a.choix, ok:a.ok}))
  };
  // L'enregistrement part pendant l'animation de fin.
  const saving = Store.save(result).then(()=>true, ()=>false);
  overlay(`
    <p class="eyebrow">Quiz terminé</p>
    <p class="big"><span>Félicitations !</span></p>
    <div class="sq" aria-hidden="true">${state.answers.map((a,i)=>`<i class="${a.ok?"on":""}" style="--n:${i}"></i>`).join("")}</div>
    <p class="meta">Vous avez répondu aux ${QUESTIONS.length} questions${player.prenom?", "+esc(player.prenom):""}. Merci pour votre participation.</p>`,
    CONFIG.DUREE_FIN_MS,
    async ()=>{ screenResult(result, await saving) });
  confetti();
}

/* Explosion de confettis carrés : ils jaillissent du bas de l'écran, montent, puis retombent.
   Dessinée sur un canvas pour rester fluide sur mobile. */
function confetti(){
  if(reducedMotion()) return;
  const cv = document.createElement("canvas");
  cv.className = "confetti"; cv.setAttribute("aria-hidden","true");
  document.body.appendChild(cv);
  const ctx = cv.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  let W=0, H=0;
  const size = () => { W = window.innerWidth; H = window.innerHeight; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0) };
  size(); window.addEventListener("resize", size);
  const colors = ["#FFFFFF","#FFFFFF","#E3E4E5","#575756","#0077AA"];
  const parts = [];
  const scale = Math.min(1.25, Math.max(.75, H/800));         // force adaptée à la hauteur de l'écran
  const burst = (x, count, spread) => {
    for(let i=0;i<count;i++){
      const ang = -Math.PI/2 + (Math.random()*2-1)*spread;      // vers le haut, éventail
      const speed = (1400 + Math.random()*1300) * scale;         // px/s
      parts.push({x, y:H+10, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed,
        s:7+Math.random()*11, c:colors[(Math.random()*colors.length)|0],
        r:Math.random()*Math.PI, vr:(Math.random()*2-1)*6, life:0});
    }
  };
  const n = W < 500 ? 55 : 90;
  burst(W*0.5, n, 0.45);                                         // canon central
  setTimeout(()=>{ burst(W*0.12, n*0.5|0, 0.3); burst(W*0.88, n*0.5|0, 0.3) }, 350);   // canons latéraux
  const G = 1100*scale, K = 2.1;                               // gravité et résistance de l'air (effet flottant)
  let last = performance.now(), start = last;
  (function frame(now){
    const dt = Math.min(0.033, (now-last)/1000); last = now;
    ctx.clearRect(0,0,W,H);
    let alive = 0;
    for(const p of parts){
      const f = Math.exp(-K*dt); p.life += dt; p.vy = p.vy*f + G*dt; p.vx *= f;
      p.x += p.vx*dt; p.y += p.vy*dt; p.r += p.vr*dt;
      if(p.y < H+40){ alive++;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
        ctx.globalAlpha = Math.max(0, Math.min(1, 1-(p.life-3)/1));  // fondu après 3 s
        ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s); ctx.restore(); }
    }
    if((alive || now-start<400) && now-start < 6000) requestAnimationFrame(frame);
    else { window.removeEventListener("resize", size); cv.remove() }
  })(last);
}

/* Classement : meilleur score d'abord, puis temps le plus court, puis participation la plus ancienne. */
const rankSort = (a,b) => b.score-a.score || a.dureeSec-b.dureeSec || new Date(a.date)-new Date(b.date);
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dmy = d => d.toLocaleDateString("fr-FR");

function periodOf(f){
  const now = new Date(), today = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(f.mode==="day"){ const b=new Date(today); b.setDate(b.getDate()+1); return {from:today,to:b,label:"Aujourd’hui ("+dmy(today)+")",slug:"jour-"+ymd(today)} }
  if(f.mode==="week"){ const a=new Date(today); a.setDate(a.getDate()-((a.getDay()+6)%7)); const b=new Date(a); b.setDate(a.getDate()+7); const last=new Date(b); last.setDate(b.getDate()-1);
    return {from:a,to:b,label:"Semaine du "+dmy(a)+" au "+dmy(last),slug:"semaine-"+ymd(a)} }
  if(f.mode==="month"){ const a=new Date(now.getFullYear(),now.getMonth(),1), b=new Date(now.getFullYear(),now.getMonth()+1,1);
    const m=a.toLocaleDateString("fr-FR",{month:"long",year:"numeric"}); return {from:a,to:b,label:m.charAt(0).toUpperCase()+m.slice(1),slug:"mois-"+ymd(a).slice(0,7)} }
  if(f.mode==="custom"){ const a=f.from?new Date(f.from+"T00:00"):null, b=f.to?new Date(f.to+"T00:00"):null; if(b) b.setDate(b.getDate()+1);
    const A=f.from?dmy(new Date(f.from+"T00:00")):"", B=f.to?dmy(new Date(f.to+"T00:00")):"";
    const label = A&&B ? "Du "+A+" au "+B : A ? "Depuis le "+A : B ? "Jusqu’au "+B : "Choisissez une date de début et/ou de fin";
    return {from:a,to:b,label,slug:"du-"+(f.from||"debut")+"-au-"+(f.to||ymd(today))} }
  return {from:null,to:null,label:"Toutes les participations",slug:"complet"};
}

function screenAdmin(note){
  const per = periodOf(adminFilter);
  const rows = adminRows.filter(r=>{const d=new Date(r.date); return (!per.from||d>=per.from)&&(!per.to||d<per.to)}).sort(rankSort);
  const n = rows.length, top = rows.slice(0, CONFIG.NB_GAGNANTS);
  const avg = n ? rows.reduce((s,r)=>s+r.score,0)/n : 0;
  const avgT = n ? Math.round(rows.reduce((s,r)=>s+r.dureeSec,0)/n) : 0;
  const rate = QUESTIONS.map((Q,qi)=>{
    let tot=0,ok=0; rows.forEach(r=>(r.reponses||[]).forEach(a=>{if(a.q===qi){tot++; if(a.ok) ok++}}));
    return {Q, pct: tot? Math.round(ok/tot*100) : null};
  });
  const modes = [["day","Jour"],["week","Semaine"],["month","Mois"],["all","Tout"],["custom","Dates"]];
  show(`
    ${bar(["Résultats","du concours ..."])}
    <p><strong>${esc(CONFIG.CONCOURS_TITRE)}</strong> · ${esc(CONFIG.CONCOURS_ID)} · ${adminRows.length} participation${adminRows.length>1?"s":""} au total</p>
    ${CONFIG.ENDPOINT?"":`<div class="msg info">Version test : seules les participations jouées sur cet appareil apparaissent. Pour réunir les participants de tous les appareils, connectez la feuille Google (CONFIG.ENDPOINT).</div>`}
    ${note?`<div class="msg info" role="status" style="margin-top:10px">${esc(note)}</div>`:""}
    <div class="panel">
      <div class="seg" role="group" aria-label="Période">
        ${modes.map(([m,l])=>`<button type="button" class="segbtn" data-mode="${m}" aria-pressed="${adminFilter.mode===m}">${l}</button>`).join("")}
      </div>
      ${adminFilter.mode==="custom"?`
      <div class="grid2" style="margin-top:12px">
        <label class="f" for="dFrom">Du<input type="date" id="dFrom" value="${esc(adminFilter.from)}"></label>
        <label class="f" for="dTo">Au<input type="date" id="dTo" value="${esc(adminFilter.to)}"></label>
      </div>`:""}
      <p class="period">${esc(per.label)}</p>
      <div class="stats">
        <div class="stat"><b>${n}</b><span>Participants</span></div>
        <div class="stat"><b>${n?avg.toFixed(1).replace(".",","):"–"}</b><span>Score moyen /${QUESTIONS.length}</span></div>
        <div class="stat"><b>${n?fmtClock(avgT):"–"}</b><span>Temps moyen</span></div>
      </div>
      <div class="row" style="margin-top:16px">
        <button class="btn" type="button" id="xCsv" ${n?"":"disabled"}>Exporter en Excel (CSV)</button>
        <button class="btn" type="button" id="xPdf" ${n?"":"disabled"}>Exporter en PDF</button>
        <button class="btn ghost" type="button" id="refresh">Actualiser</button>
      </div>
    </div>
    ${n?`
    <h3>Top ${CONFIG.NB_GAGNANTS} · gagnants de la période</h3>
    <div class="podium">
      ${top.map((r,i)=>`<div class="pod"><span class="rk">${i+1}</span><div><strong>${esc(r.email)}</strong><small>${fmtDate(r.date)}</small></div><span class="pv">${r.score}/${r.total}<small>${fmtClock(r.dureeSec)}</small></span></div>`).join("")}
    </div>
    <h3>Classement complet</h3>
    <div class="tablewrap"><table>
      <thead><tr><th>#</th><th>E-mail</th><th>Score</th><th>Temps</th><th>Date</th></tr></thead>
      <tbody>${rows.map((r,i)=>`<tr class="${i<CONFIG.NB_GAGNANTS?"win":""}"><td class="n">${i+1}</td><td>${esc(r.email)}</td><td class="n">${r.score}/${r.total}</td><td class="n">${fmtClock(r.dureeSec)}</td><td>${fmtDate(r.date)}</td></tr>`).join("")}</tbody>
    </table></div>
    <h3>Taux de bonnes réponses par question</h3>
    <div class="qrate panel" style="margin-top:0">
      ${rate.map((x,i)=>`<div class="qr"><span class="t" title="${esc(x.Q.q)}">${i+1}. ${esc(x.Q.p)} · ${esc(x.Q.q)}</span><span class="track"><span class="fill" style="display:block;width:${x.pct??0}%"></span></span><span class="v">${x.pct===null?"–":x.pct+" %"}</span></div>`).join("")}
    </div>`
    :`<div class="panel"><p style="margin:0"><strong>Aucune participation sur cette période.</strong> Choisissez une autre période ou attendez les premiers participants.</p></div>`}
    <div class="row" style="margin-top:22px">
      <button class="btn ghost" type="button" id="back">Retour au quiz</button>
      ${!CONFIG.ENDPOINT && adminRows.length?`<button class="btn danger" type="button" id="clear">Effacer les résultats de test</button>`:""}
    </div>
    <div id="confirmBox"></div>`);
  document.querySelectorAll(".segbtn").forEach(b=>b.addEventListener("click",()=>{adminFilter.mode=b.dataset.mode;screenAdmin()}));
  const dF=document.getElementById("dFrom"), dT=document.getElementById("dTo");
  if(dF) dF.addEventListener("change",()=>{adminFilter.from=dF.value;screenAdmin()});
  if(dT) dT.addEventListener("change",()=>{adminFilter.to=dT.value;screenAdmin()});
  document.getElementById("back").addEventListener("click",()=>screenStart());
  document.getElementById("refresh").addEventListener("click",async()=>{try{adminRows=await Store.list(adminPin);screenAdmin("Résultats actualisés.")}catch(e){screenAdmin(e.message)}});
  if(n){
    document.getElementById("xCsv").addEventListener("click",()=>exportCsv(rows,per));
    document.getElementById("xPdf").addEventListener("click",()=>exportPdf(rows,per,avg));
  }
  const clr = document.getElementById("clear");
  if(clr) clr.addEventListener("click",()=>{
    document.getElementById("confirmBox").innerHTML = `<div class="confirm" style="margin-top:12px"><strong>Effacer toutes les participations de test sur cet appareil ?</strong><div class="row"><button class="btn danger" type="button" id="yes">Oui, effacer</button><button class="btn ghost" type="button" id="no">Annuler</button></div></div>`;
    document.getElementById("yes").addEventListener("click",()=>{Store.clearLocal();adminRows=[];screenAdmin("Résultats de test effacés.")});
    document.getElementById("no").addEventListener("click",()=>{document.getElementById("confirmBox").innerHTML=""});
  });
}

async function exportCsv(rows, per){
  const head = ["Rang","Gagnant","E-mail","Score","Total","Temps","Temps (s)","Date"].concat(QUESTIONS.map((q,i)=>"Q"+(i+1)+" "+q.p));
  const cell = v => '"'+String(v??"").replace(/"/g,'""')+'"';
  const lines = [cell(CONFIG.CONCOURS_TITRE+" · "+per.label)].concat([head.map(cell).join(";")]).concat(rows.map((r,i)=>{
    const qs = QUESTIONS.map((_,qi)=>{const a=(r.reponses||[]).find(x=>x.q===qi); return a? (a.ok?"OK":"Faux") : ""});
    return [i+1,i<CONFIG.NB_GAGNANTS?"Oui":"",r.email,r.score,r.total,fmtClock(r.dureeSec),r.dureeSec,fmtDate(r.date)].concat(qs).map(cell).join(";");
  }));
  try{ await saveFile(`resultats-${CONFIG.CONCOURS_ID}-${per.slug}.csv`, "﻿"+lines.join("\r\n")); screenAdmin("Fichier CSV prêt. Il s’ouvre directement dans Excel.") }
  catch(e){ if(e&&e.code!=="declined") screenAdmin("L’export n’est pas disponible ici.") }
}

async function exportPdf(rows, per, avg){
  if(!window.jspdf){ return screenAdmin("Le module PDF n’a pas pu se charger. Utilisez l’export CSV.") }
  const clean = s => String(s??"").replace(/œ/g,"oe").replace(/Œ/g,"OE").replace(/[’]/g,"'");
  const doc = new window.jspdf.jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
  const W = 297, M = 14;
  doc.setFillColor(0,159,227); doc.rect(M,M,150,11,"F");
  doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(15);
  doc.text(clean("Résultats · "+CONFIG.CONCOURS_TITRE),M+3,M+7.8);
  doc.setTextColor(87,87,86); doc.setFont("helvetica","bold"); doc.setFontSize(11);
  doc.text(clean(per.label),M,M+19);
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
  doc.text(clean(`${CONFIG.CONCOURS_ID}  ·  ${rows.length} participants  ·  score moyen ${avg.toFixed(1).replace(".",",")}/${QUESTIONS.length}  ·  gagnants : les ${CONFIG.NB_GAGNANTS} premiers (score, puis temps)  ·  export du ${new Date().toLocaleString("fr-FR")}`),M,M+25);
  const cols = [["#",12],["Gagnant",24],["E-mail",110],["Score",28],["Temps",34],["Date",44]];
  let y = M+33;
  const header = ()=>{ doc.setFillColor(87,87,86); doc.rect(M,y-5,W-2*M,7,"F"); doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); let x=M+2; cols.forEach(([t,w])=>{doc.text(clean(t),x,y);x+=w}); y+=7; doc.setFont("helvetica","normal"); doc.setTextColor(87,87,86) };
  header();
  rows.forEach((r,i)=>{
    if(y>200){ doc.addPage(); y=M+8; header() }
    const win = i<CONFIG.NB_GAGNANTS;
    if(win){ doc.setFillColor(204,236,249); doc.rect(M,y-5,W-2*M,7,"F") } else if(i%2===0){ doc.setFillColor(227,228,229); doc.rect(M,y-5,W-2*M,7,"F") }
    doc.setFont("helvetica", win?"bold":"normal");
    const vals = [i+1,win?"Oui":"",r.email,r.score+"/"+r.total,fmtClock(r.dureeSec),fmtDate(r.date)];
    let x=M+2; vals.forEach((v,k)=>{ const w=cols[k][1]; doc.text(doc.splitTextToSize(clean(v),w-3)[0]||"",x,y); x+=w }); y+=7;
  });
  try{ await saveFile(`resultats-${CONFIG.CONCOURS_ID}-${per.slug}.pdf`, doc.output("blob")); screenAdmin("Fichier PDF prêt.") }
  catch(e){ if(e&&e.code!=="declined") screenAdmin("L’export n’est pas disponible ici.") }
}
